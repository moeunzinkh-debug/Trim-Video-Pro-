name: Build APKs

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -o pipefail
          if ! "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.0.0' > sdk-setup.log 2>&1; then
            cat sdk-setup.log
            python3 -c 'from pathlib import Path; text=Path("sdk-setup.log").read_text()[-20000:]; print("::error title=Android SDK setup failed::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi
          cat sdk-setup.log

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug and unsigned release APKs
        shell: bash
        run: |
          if ! gradle :app:assembleDebug :app:assembleRelease --stacktrace > apk-build.log 2>&1; then
            cat apk-build.log
            python3 -c 'from pathlib import Path; text=Path("apk-build.log").read_text()[-40000:]; print("::error title=APK build failed::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi
          cat apk-build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TrimVideoPro-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TrimVideoPro-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add download information
        run: |
          echo '## APK builds' >> "$GITHUB_STEP_SUMMARY"
          echo '- **Debug:** signed with the Android debug key; installable.' >> "$GITHUB_STEP_SUMMARY"
          echo '- **Release:** unsigned; sign with your own release key before installation or publishing.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Download both APK ZIPs from the artifacts section of this run.' >> "$GITHUB_STEP_SUMMARY"
